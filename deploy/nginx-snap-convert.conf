# Snap Convert — https://crkayes.com/snap-convert/   (P25; headers from docs/launch/headers.md)
#
# Install (owner, once — see docs/launch/checklist.md):
#   1. Copy this file to /etc/nginx/snippets/snap-convert.conf on the server.
#   2. In crkayes.com's HTTPS `server { … }` block, add this line above the `location /` that
#      proxies to Next.js:
#          include /etc/nginx/snippets/snap-convert.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Paths assume DEPLOY_PATH=/var/www/snap-convert in deploy/.env. If yours is different, change
# every "/var/www/snap-convert" below (one `root`, six `include` lines).
#
# Server layout, made by deploy/deploy.ts + deploy/remote/activate.sh:
#   /var/www/snap-convert/releases/<release>/snap-convert/   the built files (build/client)
#   /var/www/snap-convert/releases/<release>/deploy/         CSP template, hashes, activate.sh
#   /var/www/snap-convert/current -> releases/<release>      switched atomically on deploy
#   /var/www/snap-convert/security-headers.conf              CSP + security headers for the
#                                                            live release (rewritten on deploy)
#
# `root` (not `alias`) avoids nginx's alias + try_files bugs: the URL /snap-convert/x maps to
# /var/www/snap-convert/current/snap-convert/x. Only the snap-convert/ folder of a release is
# reachable; deploy/ next to it is not.
#
# nginx gotcha: `add_header` in a nested location replaces ALL add_header lines from outside it.
# So every location that sets its own Cache-Control also includes security-headers.conf;
# otherwise assets/ would lose CSP, COOP and COEP and cross-origin isolation would break.

# /snap-convert (no slash) → /snap-convert/
location = /snap-convert {
    return 301 /snap-convert/;
}

# ^~ : once this prefix matches, nginx skips the site's regex locations (e.g. a `\.(js|css)$`
# rule for Next.js), so every Snap Convert file is answered here.
location ^~ /snap-convert/ {
    root /var/www/snap-convert/current;

    # Pages: /snap-convert/png-to-jpg → png-to-jpg/index.html. Unknown URLs get a real 404,
    # rendered by React Router's SPA shell (its not-found page; docs/05).
    try_files $uri $uri/index.html $uri.html =404;
    error_page 404 /snap-convert/__spa-fallback.html;

    # Compression: deploy writes .gz (and .br) next to every text and .wasm file.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml application/xml
               text/xml text/plain;
    # Only if the ngx_brotli module is installed (`nginx -V 2>&1 | grep -o brotli`):
    # brotli_static on;

    # HTML, *.data (route data), sw.js, sitemap.xml, robots.txt, pwa-engines.json, samples,
    # the 404 page: always revalidate, so a deploy is seen at once.
    include /var/www/snap-convert/security-headers.conf;
    add_header Cache-Control "no-cache" always;

    # Hashed file names (JS, CSS, fonts, wasm, pdf.js CMaps): cache for a year.
    location ^~ /snap-convert/assets/ {
        include /var/www/snap-convert/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Older nginx mime.types lack these. `types {}` + default_type forces the type here only.
        location ~ \.wasm$ {
            types { }
            default_type application/wasm;
            include /var/www/snap-convert/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            include /var/www/snap-convert/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # App icons and link-preview images: names are not hashed, so a week, not immutable.
    location ~ ^/snap-convert/(?:icons|og)/ {
        include /var/www/snap-convert/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /snap-convert/manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /var/www/snap-convert/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # HSTS and any other `add_header` lines in crkayes.com's server block do NOT reach these
    # locations (they set their own add_header). Put the site's Strict-Transport-Security value
    # in DEPLOY_HSTS (deploy/.env) and deploy adds it to security-headers.conf.
}
